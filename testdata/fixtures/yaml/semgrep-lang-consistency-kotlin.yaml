rules:
  - id: uses-bad
    message: "m"
    # ruleid: lang-consistency-kotlin
    languages: [kt]
    severity: WARNING
    pattern: foo($X)
  - id: uses-bad2
    message: "m"
    # ruleid: lang-consistency-kotlin
    languages: [kt, kotlin]
    severity: WARNING
    pattern: foo2($X)
  - id: uses-good
    message: "m"
    # ok: lang-consistency-kotlin
    languages: [kotlin]
    severity: WARNING
    pattern: bar($X)
  - id: uses-good2
    message: "m"
    # ok: lang-consistency-kotlin
    languages: [kotlin, kts]
    severity: WARNING
    pattern: bar2($X)
