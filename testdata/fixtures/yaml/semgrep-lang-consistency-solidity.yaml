rules:
  - id: uses-bad
    message: "m"
    # ruleid: lang-consistency-solidity
    languages: [sol]
    severity: WARNING
    pattern: foo($X)
  - id: uses-bad2
    message: "m"
    # ruleid: lang-consistency-solidity
    languages: [sol, solidity]
    severity: WARNING
    pattern: foo2($X)
  - id: uses-good
    message: "m"
    # ok: lang-consistency-solidity
    languages: [solidity]
    severity: WARNING
    pattern: bar($X)
  - id: uses-good2
    message: "m"
    # ok: lang-consistency-solidity
    languages: [solidity, yul]
    severity: WARNING
    pattern: bar2($X)
