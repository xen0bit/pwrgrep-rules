rules:
  - id: uses-bad
    message: "m"
    # ruleid: lang-consistency-go
    languages: [golang]
    severity: WARNING
    pattern: foo($X)
  - id: uses-bad2
    message: "m"
    # ruleid: lang-consistency-go
    languages: [golang, go]
    severity: WARNING
    pattern: foo2($X)
  - id: uses-good
    message: "m"
    # ok: lang-consistency-go
    languages: [go]
    severity: WARNING
    pattern: bar($X)
  - id: uses-good2
    message: "m"
    # ok: lang-consistency-go
    languages: [go, gox]
    severity: WARNING
    pattern: bar2($X)
