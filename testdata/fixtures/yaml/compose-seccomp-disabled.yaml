version: "3"
services:
  # ruleid: seccomp-confinement-disabled
  web:
    image: nginx
    security_opt:
      - seccomp:unconfined
  # ruleid: seccomp-confinement-disabled
  api:
    image: myapi:latest
    security_opt:
      - seccomp:unconfined
  # ok: seccomp-confinement-disabled
  worker:
    image: worker:1.0
  # ok: seccomp-confinement-disabled
  cron:
    image: cron:1.0
    security_opt:
      - no-new-privileges:true
