# The fixtures are the corpus's test data, and a fixture for a rule that finds
# a leaked credential has to contain a credential-shaped string. None of them
# is a real secret - they are invented values written to trip the rule they sit
# beside - but a scanner cannot tell that, and it is right not to try.
#
# Without this, adding a rule for a new kind of token means either shipping it
# with no fixture or bending the fixture's value until no scanner recognises it,
# and a fixture bent that far no longer demonstrates the thing it is for.
paths-ignore:
  - "testdata/fixtures/**"
