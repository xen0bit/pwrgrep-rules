apiVersion: v1
kind: Pod
metadata:
  name: bad1
spec:
  containers:
    # ruleid: writable-filesystem-container
    - name: app
      image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: bad2
spec:
  containers:
    # ruleid: writable-filesystem-container
    - name: app
      image: nginx
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: good1
spec:
  containers:
    # ok: writable-filesystem-container
    - name: app
      image: nginx
      securityContext:
        readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Pod
metadata:
  name: good2
spec:
  containers:
    # ok: writable-filesystem-container
    - name: app
      image: nginx
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
