rules:
  - id: uses-bad
    message: "m"
    # ruleid: lang-consistency-elixir
    languages: [ex]
    severity: WARNING
    pattern: foo($X)
  - id: uses-bad2
    message: "m"
    # ruleid: lang-consistency-elixir
    languages: [ex, elixir]
    severity: WARNING
    pattern: foo2($X)
  - id: uses-good
    message: "m"
    # ok: lang-consistency-elixir
    languages: [elixir]
    severity: WARNING
    pattern: bar($X)
  - id: uses-good2
    message: "m"
    # ok: lang-consistency-elixir
    languages: [elixir, erl]
    severity: WARNING
    pattern: bar2($X)
