apiVersion: v1
kind: Pod
metadata:
  name: bad1
spec:
  containers:
    # ruleid: allow-privilege-escalation-no-securitycontext
    - name: app
      image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: bad2
spec:
  containers:
    # ruleid: allow-privilege-escalation-no-securitycontext
    - name: sidecar
      image: redis
---
apiVersion: v1
kind: Pod
metadata:
  name: good1
spec:
  containers:
    # ok: allow-privilege-escalation-no-securitycontext
    - name: app
      image: nginx
      securityContext:
        allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Pod
metadata:
  name: good2
spec:
  containers:
    # ok: allow-privilege-escalation-no-securitycontext
    - name: app
      image: nginx
      securityContext:
        runAsNonRoot: true
