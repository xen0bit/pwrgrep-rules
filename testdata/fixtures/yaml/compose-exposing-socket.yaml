# CWE-829: Compose file exposes Docker socket into a container.
# Mounting the Docker socket gives the container full Docker control;
# that is container escape. The rule flags any volume with that source.
# Fix by not mounting the socket or using a restricted proxy.
version: '3'
services:
  web:
    image: nginx
    volumes:
# ruleid: exposing-docker-socket-volume
      - /var/run/docker.sock:/var/run/docker.sock
  bad2:
    image: nginx
    volumes:
# ruleid: exposing-docker-socket-volume
      - /var/run/docker.sock:/var/run/docker.sock
  good1:
    image: nginx
    volumes:
# ok: exposing-docker-socket-volume
      - ./data:/data
  good2:
    image: nginx
    volumes:
# ok: exposing-docker-socket-volume
      - ./cache:/cache

---
# Extra: service without volumes (omission of socket mount is secure).
# ok: exposing-docker-socket-volume
version: '3'
services:
  ok_extra:
    image: nginx