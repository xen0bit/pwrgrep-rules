rules:
  - id: uses-bad
    message: "m"
    # ruleid: lang-consistency-ts
    languages: [typescript]
    severity: WARNING
    pattern: foo($X)
  - id: uses-bad2
    message: "m"
    # ruleid: lang-consistency-ts
    languages: [typescript, ts]
    severity: WARNING
    pattern: foo2($X)
  - id: uses-good
    message: "m"
    # ok: lang-consistency-ts
    languages: [ts]
    severity: WARNING
    pattern: bar($X)
  - id: uses-good2
    message: "m"
    # ok: lang-consistency-ts
    languages: [ts, tsx]
    severity: WARNING
    pattern: bar2($X)
