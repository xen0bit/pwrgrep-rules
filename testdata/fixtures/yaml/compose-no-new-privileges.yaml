version: "3"
services:
  # ruleid: no-new-privileges
  web:
    image: nginx
    ports:
      - "80:80"
  # ruleid: no-new-privileges
  api:
    image: myapi:latest
  # ok: no-new-privileges
  worker:
    image: worker:1.0
    security_opt:
      - no-new-privileges:true
  # ok: no-new-privileges
  cron:
    image: cron:1.0
    security_opt:
      - no-new-privileges:true
