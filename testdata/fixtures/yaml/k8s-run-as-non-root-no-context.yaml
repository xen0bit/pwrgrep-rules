apiVersion: v1
kind: Pod
metadata:
  name: bad1
spec:
  containers:
    # ruleid: run-as-non-root-container-level-missing-security-context
    - name: app
      image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: bad2
spec:
  containers:
    # ruleid: run-as-non-root-container-level-missing-security-context
    - name: sidecar
      image: redis
---
apiVersion: v1
kind: Pod
metadata:
  name: good1
spec:
  containers:
    # ok: run-as-non-root-container-level-missing-security-context
    - name: app
      image: nginx
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: good2
spec:
  containers:
    # ok: run-as-non-root-container-level-missing-security-context
    - name: app
      image: nginx
      securityContext:
        allowPrivilegeEscalation: false
