# CWE-250: runAsUser 0 runs as root.
apiVersion: v1
kind: Pod
metadata:
  name: bad1
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
# ruleid: k8s-run-as-root
      runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: bad2
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
# ruleid: k8s-run-as-root
      runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: good1
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
# ok: k8s-run-as-root
      runAsUser: 1000
---
apiVersion: v1
kind: Pod
metadata:
  name: good2
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
# ok: k8s-run-as-root
      runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: bad3
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
# ruleid: k8s-run-as-root
      runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: bad4
spec:
  initContainers:
  - name: init
    image: busybox
    securityContext:
# ruleid: k8s-run-as-root
      runAsUser: 0
  containers:
  - name: app
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: good3
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
# ok: k8s-run-as-root
      runAsUser: 2000
