# CSRF bypass headers let cross-site requests skip the token check.
# Only bypass with an explicit content-type blacklist.
play.filters.csrf.header.bypassHeaders {
  // ruleid: conf-csrf-headers-bypass
  X-Requested-With = "*"
  // ruleid: conf-csrf-headers-bypass
  Csrf-Token = "nocheck"
  // ruleid: conf-csrf-headers-bypass
  X-Requested-With = "*"
}
play.http.secret.key = "fixed-secret-key"
# ok: conf-csrf-headers-bypass
play.http.secret.key = "another-fixed-key"
# ok: conf-csrf-headers-bypass
play.filters.csrf.token.name = "fixed-token"
# ok: conf-csrf-headers-bypass
play.http.session.maxAge = 3600
