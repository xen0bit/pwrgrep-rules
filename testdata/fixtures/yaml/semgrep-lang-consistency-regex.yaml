rules:
  - id: uses-bad
    message: "m"
    # ruleid: lang-consistency-regex
    languages: [none]
    severity: WARNING
    pattern: foo($X)
  - id: uses-bad2
    message: "m"
    # ruleid: lang-consistency-regex
    languages: [none, regex]
    severity: WARNING
    pattern: foo2($X)
  - id: uses-good
    message: "m"
    # ok: lang-consistency-regex
    languages: [regex]
    severity: WARNING
    pattern: bar($X)
  - id: uses-good2
    message: "m"
    # ok: lang-consistency-regex
    languages: [regex, text]
    severity: WARNING
    pattern: bar2($X)
