# CWE-94: GitHub Actions allows unsecure commands (injection sink).
# Setting the unsecure commands variable to true re-enables the old
# set-env sink. The rule flags env blocks that enable it; fix by
# setting false or omitting the variable.
name: bad1
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
# ruleid: allowed-unsecure-commands
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - run: echo "hi"
